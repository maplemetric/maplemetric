spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  jpa:
    properties:
      hibernate:
        format_sql: false

management:
  # 관리 경로를 서비스 포트와 분리한다.
  #
  # 지표를 보호하는 방법이 이 분리 하나다. 이 포트를 외부에 공개하지 않는 것이
  # 전제이며, 그것은 배포 구성이 지켜야 한다. 서비스 포트만 공개하고 이 포트는
  # 같은 네트워크 안에서만 닿게 둔다.
  #
  # 전제가 깨지면 지표가 인증 없이 공개된다. 배포 구성을 만들 때 이 포트가
  # 공개 대상에 없는지 반드시 확인한다.
  server:
    port: ${MANAGEMENT_PORT:9090}

  # 분리된 포트에서만 넓힌다. 서비스 포트에는 아무것도 열리지 않는다.
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: never

logging:
  level:
    root: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

maplemetric:
  nexon:
    open-api:
      keys: ${NEXON_OPEN_API_KEYS:${NEXON_OPEN_API_KEY}}