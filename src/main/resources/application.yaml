spring:
  application:
    name: maplemetric-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:maplemetric}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: when-authorized

maplemetric:
  nexon:
    open-api:
      base-url: https://open.api.nexon.com
      key: ${NEXON_OPEN_API_KEY:}

  openai:
    enabled: ${OPENAI_ENABLED:false}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:3s}
    read-timeout: ${OPENAI_READ_TIMEOUT:10s}
