spring:
  application:
    name: maplemetric-service

  profiles:
    # 기본값을 두지 않는다. profile을 지정하지 않고 띄우면 아래 기본 설정만 적용되고,
    # 그 기본은 Actuator를 health 하나로 닫아 둔다.
    #
    # local을 기본값으로 두면 지정을 잊은 배포가 개발용 설정으로 뜬다. 개발용은
    # Actuator를 넓게 열고 상태 상세까지 내보내므로, 잊었을 때 가장 넓게 열리는
    # 셈이 된다.
    active: ${SPRING_PROFILES_ACTIVE:}

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:maplemetric}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  # 기본은 닫는다. 필요한 profile만 넓힌다.
  #
  # 이 앞을 막는 것이 없다. Spring Security 의존성이 없고 내부 인증 필터는
  # /internal 만 본다. 그래서 여기 여는 것은 곧 인증 없이 공개하는 것이다.
  #
  # 반대로 두면 profile을 새로 만들 때 좁히는 것을 잊는 순간 전부 열린 채로 나간다.
  # 잊었을 때 닫히는 쪽이 기본이어야 한다.
  #
  # health는 컨테이너와 로드밸런서가 인증 없이 확인해야 하는 경로라 남긴다.
  endpoints:
    web:
      exposure:
        include:
          - health

  endpoint:
    health:
      show-details: never

maplemetric:
  nexon:
    open-api:
      base-url: https://open.api.nexon.com
      # Key를 여럿 둘 수 있다. Nexon은 초당·일일 한도를 애플리케이션 단위로
      # 세므로, 애플리케이션을 따로 등록해 받은 Key를 함께 쓰면 그만큼 한도가
      # 늘어난다. 한도가 Key마다 따로 붙는다는 것이 요점이다.
      #
      # 단수형도 그대로 받는다. Key 하나만 쓰던 설정을 고치지 않아도 된다.
      keys: ${NEXON_OPEN_API_KEYS:}
      key: ${NEXON_OPEN_API_KEY:}

    # Nexon은 애플리케이션 단위로 초당 호출 수를 제한한다. 넘기면 429가 돌아오고
    # 그 응답도 호출로 집계될 수 있어 한도를 넘기는 것 자체가 손해다.
    # 개발 단계 5, 서비스 단계 500.
    #
    # 이 값은 Key 하나당 한도다. Key가 여럿이면 관문이 Key마다 따로 세므로
    # 전체 처리량은 Key 수만큼 늘어난다.
    rate-limit:
      requests-per-second: ${NEXON_REQUESTS_PER_SECOND:5}

      # Key 목록 앞에서부터 몇 개를 실패하면 안 되는 요청 몫으로 떼어 둘지다.
      # 나머지는 과거 결손 메우기 같은 대량 요청이 쓴다. Nexon은 하루 한도도
      # 애플리케이션 단위로 세므로, 갈라 두면 하루 사용량을 세지 않고도 정기
      # 수집의 예산이 지켜진다.
      #
      # 적지 않으면 Key 수를 보고 정한다. Key가 셋 이상이면 둘을 떼어 둔다.
      # 캐릭터 조회 하나가 21회를 쓰기 때문에 실패하면 안 되는 쪽에 초당 여유를
      # 더 준다. Key가 하나면 갈리지 않고 둘이 같은 Key를 함께 쓴다.
      reserved-critical-key-count: ${NEXON_RESERVED_CRITICAL_KEY_COUNT:}

      # 허가를 기다리는 상한이다. 서로 다른 캐릭터를 동시에 조회하면 저장본
      # 합치기가 적용되지 않아 요청마다 21회를 쓴다. 상한이 없으면 처리 Thread가
      # 언제 끝날지 모르는 대기에 묶인다. 넘기면 시간 초과로 알린다.
      max-wait: ${NEXON_PERMIT_MAX_WAIT:10s}

  openai:
    enabled: ${OPENAI_ENABLED:false}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:3s}
    read-timeout: ${OPENAI_READ_TIMEOUT:10s}

  analysis:
    # 통계 설명 생성 한도다.
    # 유료 호출이므로 잘못된 실행 한 번이 예산을 소진하지 않아야 한다.
    # range-preset 기본이 90D인 이유는 하루·일주일 변화가 노이즈이기 때문이다.
    statistics-insight:
      max-per-run: ${STATISTICS_INSIGHT_MAX_PER_RUN:70}
      range-preset: ${STATISTICS_INSIGHT_RANGE_PRESET:90D}

  character:
    snapshot:
      # 갱신 한 번이 Nexon을 21회 호출한다. 연타로 그만큼씩 소비하지 않게 한다.
      min-refresh-interval: ${CHARACTER_MIN_REFRESH_INTERVAL:5m}

      # 같은 캐릭터를 이미 수집 중이면 그 결과를 기다린다. 각자 수집하면 호출량이
      # 요청 수만큼 늘어나기 때문이다.
      #
      # 수집이 모두 재시도를 소진하면 이론상 9분까지 걸리지만 그만큼 기다리게 하면
      # 요청 처리 Thread가 묶인다. 기다리다 한도를 넘기면 저장본이 있는 경우 그것을
      # 돌려주므로, 실제 수집 소요를 덮되 사용자가 포기하지 않을 값으로 둔다.
      collect-wait-timeout: ${CHARACTER_COLLECT_WAIT_TIMEOUT:30s}

      # 수집을 맡은 쪽 자신의 상한이다. 호출 하나하나에는 상한이 있지만 수집 전체에는
      # 없어서, 기다리는 쪽이 위 한도로 포기한 뒤에도 일하는 쪽은 계속 호출했다.
      #
      # 상한을 넘기면 남은 조회를 시작하지 않고 시간 초과로 끝낸다. 확인은 Port 호출
      # 앞에서 하는데 Ranking·Skills·HEXA는 Port 하나가 Nexon을 여러 번 부른다. 그
      # 안에서 상한을 넘기면 남은 호출이 나가므로 실제 소요는 이 값을 최대 네 번의
      # 호출만큼 넘길 수 있다.
      #
      # 경과는 단조 증가값으로 잰다. 벽시계로 재면 NTP 보정이 상한을 늘리거나 멀쩡한
      # 수집을 자른다.
      #
      # 값은 기다리는 쪽과 같은 30초로 둔다. 아직 실측한 p95가 없어 수집 소요에서
      # 끌어낸 값이 아니라, 두 쪽이 같은 시점에 포기하게 하려는 운영상의 선택이다.
      # 실사용 소요를 재고 나면 다시 정한다.
      max-collect-duration: ${CHARACTER_MAX_COLLECT_DURATION:30s}

  internal:
    api-key: ${MAPLEMETRIC_INTERNAL_API_KEY:}

    ranking:
      overall-ranking-collection:
        max-pages: ${RANKING_COLLECTION_MAX_PAGES:10}

        scheduler:
          enabled: ${RANKING_COLLECTION_SCHEDULER_ENABLED:false}
          cron: "${RANKING_COLLECTION_SCHEDULER_CRON:0 40 9 * * *}"
          zone: ${RANKING_COLLECTION_SCHEDULER_ZONE:Asia/Seoul}

      # 과거 Snapshot Backfill 한도다.
      # request-interval은 Nexon 공식 Rate Limit 수치가 아니라 과거 데이터를 몰아
      # 받지 않기 위한 보수적인 기본값이다.
      overall-ranking-backfill:
        max-pages: ${RANKING_BACKFILL_MAX_PAGES:10}
        max-attempts-per-date: ${RANKING_BACKFILL_MAX_ATTEMPTS_PER_DATE:3}
        max-dates-per-run: ${RANKING_BACKFILL_MAX_DATES_PER_RUN:7}
        request-interval: ${RANKING_BACKFILL_REQUEST_INTERVAL:2s}

        # 강제 종료로 점유된 채 남은 기준일을 회수하는 기준이다.
        # 한 기준일의 정상 수집 소요보다 넉넉해야 실행 중인 기준일을 뺏지 않는다.
        stale-claim-timeout: ${RANKING_BACKFILL_STALE_CLAIM_TIMEOUT:10m}

      # 수집 결과 보존 한도다.
      #
      # 자동 삭제는 하지 않는다. enabled는 꺼진 채로 둔다. 기준일 1개가 약 0.63 MB라
      # 1년에 약 230 MB 늘어나는데, Nexon은 랭킹 이력을 2년만 주므로 2년 밖으로
      # 나간 기준일은 지우면 다시 받을 수 없다. 통계 이력의 ALL은 남아 있는 전부를
      # 보므로 지우는 만큼 그 지표의 시작점이 앞으로 밀린다. 아끼는 용량에 비해
      # 잃는 것이 영구적이다.
      #
      # retention-days 3650은 삭제를 시작하겠다는 뜻이 아니라, 10년이 지나 저장
      # 비용이 실제로 문제가 됐을 때 다시 판단하기 위한 상한이다.
      overall-ranking-retention:
        enabled: ${RANKING_RETENTION_ENABLED:false}
        retention-days: ${RANKING_RETENTION_DAYS:3650}
        max-dates-per-run: ${RANKING_RETENTION_MAX_DATES_PER_RUN:30}
